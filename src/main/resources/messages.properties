industry.furnaces.title=Fornos Industriais
industry.furnaces.description=Projetamos, fabricamos e reparamos fornos industriais para tratamento t\u00E9rmico, forjamento e processos metal\u00FArgicos \u2014 constru\u00EDdos para suportar temperaturas extremas e opera\u00E7\u00E3o cont\u00EDnua.

# --- 02. Metal Structures ---
industry.metal.structures.title=Estruturas Met\u00E1licas
industry.metal.structures.description=Fabricamos e instalamos estruturas met\u00E1licas portantes e auxiliares para instala\u00E7\u00F5es industriais, armaz\u00E9ns e projetos de infraestrutura \u2014 projetadas para durabilidade e precis\u00E3o estrutural.

# --- 03. Welding ---
industry.welding.title=Soldadura
industry.welding.description=Realizamos trabalhos de soldadura certificada para equipamentos industriais, tubagens e estruturas met\u00E1licas \u2014 aplicando t\u00E9cnicas MIG, TIG e soldadura por arco com os mais elevados padr\u00F5es de qualidade.

# --- 04. Solar Panels ---
industry.solar.panels.title=Pain\u00E9is Solares
industry.solar.panels.description=Fornecemos e instalamos sistemas de pain\u00E9is solares de grau industrial para unidades de produ\u00E7\u00E3o e propriedades comerciais \u2014 reduzindo custos energ\u00E9ticos e garantindo independ\u00EAncia energ\u00E9tica a longo prazo.

# --- 05. Engineering ---
industry.engineering.title=Engenharia
industry.engineering.description=Prestamos servi\u00E7os de engenharia de ciclo completo \u2014 desde consultoria t\u00E9cnica e documenta\u00E7\u00E3o de projeto at\u00E9 supervis\u00E3o em obra \u2014 garantindo que cada solu\u00E7\u00E3o cumpre os requisitos de seguran\u00E7a e efici\u00EAncia industrial.


