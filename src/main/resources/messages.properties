# -------------------------------------------------------
# 01. Industrial Furnaces Design
# -------------------------------------------------------
services.furnaces-design.title=Projeto de Fornos Industriais \u2014 Engenharia e Solu\u00E7\u00F5es T\u00E9cnicas
services.furnaces-design.h1=Projeto de Fornos Industriais
services.furnaces-design.desc=\
  - Desenvolvimento de projetos de fornos personalizados com base nos requisitos do processo do cliente: gama de temperatura, atmosfera, capacidade de carga e tempo de ciclo\n\
  - C\u00E1lculos t\u00E9rmicos, an\u00E1lise do balan\u00E7o de calor e sele\u00E7\u00E3o de elementos de aquecimento e materiais refrat\u00E1rios\n\
  - Elabora\u00E7\u00E3o de documenta\u00E7\u00E3o t\u00E9cnica completa: desenhos, especifica\u00E7\u00F5es, listas de materiais e fichas de equipamentos\n\
  - Projeto de sistemas de controlo: perfis de temperatura, integra\u00E7\u00E3o de PLC e bloqueios de seguran\u00E7a\n\
  - Otimiza\u00E7\u00E3o da efici\u00EAncia energ\u00E9tica \u2014 redu\u00E7\u00E3o do consumo de g\u00E1s e eletricidade sem comprometer a qualidade do processo\n\
  - Coordena\u00E7\u00E3o com as equipas de fabrico, instala\u00E7\u00E3o e comissionamento ao longo do ciclo de vida do projeto

# -------------------------------------------------------
# 02. Industrial Furnaces Repair
# -------------------------------------------------------
services.furnaces-repair.title=Repara\u00E7\u00E3o de Fornos Industriais \u2014 Manuten\u00E7\u00E3o e Restauro
services.furnaces-repair.h1=Repara\u00E7\u00E3o de Fornos Industriais
services.furnaces-repair.desc=\
  - Inspe\u00E7\u00E3o de diagn\u00F3stico e avalia\u00E7\u00E3o do estado de todos os tipos de fornos: c\u00E2mara, cont\u00EDnuos, verticais e de tapete\n\
  - Substitui\u00E7\u00E3o e restauro de revestimento refrat\u00E1rio, blocos de isolamento e m\u00F3dulos de fibra cer\u00E2mica\n\
  - Repara\u00E7\u00E3o e substitui\u00E7\u00E3o de elementos de aquecimento, queimadores, termopares e equipamento de controlo de temperatura\n\
  - Restauro de carca\u00E7as, portas, vedantes e sistemas de acionamento mec\u00E2nico dos fornos\n\
  - Servi\u00E7os de repara\u00E7\u00E3o de emerg\u00EAncia com prazo m\u00EDnimo para reduzir o tempo de paragem da produ\u00E7\u00E3o\n\
  - Comissionamento p\u00F3s-repara\u00E7\u00E3o, ensaios de uniformidade de temperatura e verifica\u00E7\u00E3o de desempenho

# -------------------------------------------------------
# 03. Metal Structures
# -------------------------------------------------------
services.metal-structures.title=Estruturas Met\u00E1licas \u2014 Fabrica\u00E7\u00E3o, Montagem e Instala\u00E7\u00E3o
services.metal-structures.h1=Estruturas Met\u00E1licas
services.metal-structures.desc=\
  - Engenharia e fabrica\u00E7\u00E3o de estruturas de a\u00E7o portantes para edif\u00EDcios industriais, naves de produ\u00E7\u00E3o e armaz\u00E9ns\n\
  - Fabrico de estruturas de servi\u00E7o: plataformas de acesso, escadas, sistemas de corrim\u00E3o e suportes de equipamentos\n\
  - Corte, conforma\u00E7\u00E3o e soldadura de precis\u00E3o de perfis estruturais, chapas e tubagens com toler\u00E2ncias de engenharia\n\
  - Prepara\u00E7\u00E3o de superf\u00EDcies, prim\u00E1rio anticorros\u00E3o e aplica\u00E7\u00E3o de revestimentos protetores e decorativos\n\
  - Montagem e instala\u00E7\u00E3o em obra com controlo geod\u00E9sico de alinhamento e valida\u00E7\u00E3o documental\n\
  - Pacote completo de documenta\u00E7\u00E3o: certificados de material e soldadura, relat\u00F3rios de inspe\u00E7\u00E3o dimensional e telas finais

# -------------------------------------------------------
# 04. Welding & Assembly
# -------------------------------------------------------
services.welding-assembly.title=Soldadura e Montagem \u2014 Trabalhos Industriais Certificados
services.welding-assembly.h1=Soldadura e Montagem
services.welding-assembly.desc=\
  - Soldadura certificada de equipamentos industriais, vasos de press\u00E3o, tubagens, reservat\u00F3rios e estruturas met\u00E1licas\n\
  - Aplica\u00E7\u00E3o dos processos MIG/MAG, TIG, MMA e soldadura por arco submerso adaptados ao material e \u00E0 junta\n\
  - Soldadura de a\u00E7o carbono, a\u00E7o inoxid\u00E1vel, ligas duplex, alum\u00EDnio e materiais resistentes ao calor\n\
  - Montagem mec\u00E2nica de equipamentos industriais: liga\u00E7\u00F5es aparafusadas e flangeadas, ajustes de rolamentos e alinhamento\n\
  - Ensaios n\u00E3o destrutivos de soldaduras: inspe\u00E7\u00E3o visual, l\u00EDquidos penetrantes, radiografia e ultrassons\n\
  - Especifica\u00E7\u00F5es de procedimento de soldadura (WPS) e registos de qualifica\u00E7\u00E3o de soldadores conforme EN ISO 15614

# -------------------------------------------------------
# 05. Engineering Consulting
# -------------------------------------------------------
services.engineering-consulting.title=Consultoria de Engenharia \u2014 Assessoria T\u00E9cnica e Apoio a Projetos
services.engineering-consulting.h1=Consultoria de Engenharia
services.engineering-consulting.desc=\
  - Auditorias t\u00E9cnicas de equipamentos industriais e processos de produ\u00E7\u00E3o existentes, com relat\u00F3rio de conclus\u00F5es e recomenda\u00E7\u00F5es\n\
  - Estudos de viabilidade e justifica\u00E7\u00E3o de investimento para novos equipamentos, moderniza\u00E7\u00F5es e expans\u00F5es de instala\u00E7\u00F5es\n\
  - Elabora\u00E7\u00E3o de especifica\u00E7\u00F5es t\u00E9cnicas, cadernos de encargos e pacotes de \u00E2mbito de trabalho para aquisi\u00E7\u00E3o\n\
  - Avalia\u00E7\u00E3o de fornecedores, an\u00E1lise de propostas e apoio t\u00E9cnico durante a sele\u00E7\u00E3o de equipamentos e negocia\u00E7\u00E3o contratual\n\
  - Fiscaliza\u00E7\u00E3o de obra e controlo de qualidade em todas as fases do projeto: projeto, fabrico, instala\u00E7\u00E3o e comissionamento\n\
  - Revis\u00E3o de conformidade regulamentar: seguran\u00E7a industrial, licen\u00E7as ambientais e requisitos de marca\u00E7\u00E3o CE / UKCA



