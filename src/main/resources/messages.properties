services.metal.structures.description=Fabricamos e montamos estruturas met\u00E1licas para uso industrial e civil, com rigor dimensional e materiais certificados, do projeto \u00E0 instala\u00E7\u00E3o final.

# --- 04. Welding & Assembly ---
services.welding.assembly.title=Soldadura e Montagem
services.welding.assembly.description=Executamos trabalhos de soldadura e montagem mec\u00E2nica com qualifica\u00E7\u00E3o t\u00E9cnica elevada, assegurando a integridade estrutural e a qualidade de cada junta e liga\u00E7\u00E3o.

# --- 05. Engineering Consulting ---
services.engineering.consulting.title=Consultoria de Engenharia
services.engineering.consulting.description=Prestamos servi\u00E7os de consultoria t\u00E9cnica especializados, apoiando empresas na an\u00E1lise, otimiza\u00E7\u00E3o e desenvolvimento de projetos e processos industriais complexos.


