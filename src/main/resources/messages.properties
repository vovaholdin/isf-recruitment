# -------------------------------------------------------
# Industrial Furnaces
# -------------------------------------------------------
industries.industrial-furnaces.title=Fornos Industriais \u2014 Tratamento T\u00E9rmico e Metalurgia
industries.industrial-furnaces.h1=Fornos Industriais
industries.industrial-furnaces.desc=\
  - Projeto e fabrico de fornos industriais personalizados para tratamento t\u00E9rmico, recozimento, t\u00EAmpera e revenido\n\
  - Engenharia de sistemas de alta temperatura para produ\u00E7\u00E3o metal\u00FArgica, cer\u00E2mica e qu\u00EDmica\n\
  - Produ\u00E7\u00E3o de ciclo completo: da especifica\u00E7\u00E3o t\u00E9cnica e desenhos at\u00E9 \u00E0 fabrica\u00E7\u00E3o e comissionamento em obra\n\
  - Repara\u00E7\u00E3o, moderniza\u00E7\u00E3o e substitui\u00E7\u00E3o de revestimentos refrat\u00E1rios em equipamentos de fornos existentes\n\
  - Sistemas de queimadores energeticamente eficientes e integra\u00E7\u00E3o de controlo autom\u00E1tico de temperatura\n\
  - Conformidade com normas de seguran\u00E7a industrial e diretivas de equipamentos sob press\u00E3o

# -------------------------------------------------------
# Metal Structures
# -------------------------------------------------------
industries.metal-structures.title=Estruturas Met\u00E1licas \u2014 Fabrica\u00E7\u00E3o e Montagem
industries.metal-structures.h1=Estruturas Met\u00E1licas
industries.metal-structures.desc=\
  - Projeto e fabrica\u00E7\u00E3o de estruturas de a\u00E7o portantes para edif\u00EDcios industriais, armaz\u00E9ns e pavilh\u00F5es de produ\u00E7\u00E3o\n\
  - Fabrico de estruturas auxiliares: plataformas, escadas, corrim\u00E3os, passadi\u00E7os e suportes\n\
  - Corte, dobragem e soldadura de precis\u00E3o de perfis de a\u00E7o estrutural conforme especifica\u00E7\u00F5es de engenharia\n\
  - Tratamento anticorros\u00E3o, prim\u00E1rio e revestimento protetor de todos os componentes met\u00E1licos\n\
  - Montagem e instala\u00E7\u00E3o em obra com controlo de alinhamento e inspe\u00E7\u00E3o de qualidade\n\
  - Documenta\u00E7\u00E3o: certificados de material, relat\u00F3rios de inspe\u00E7\u00E3o de soldadura e telas finais

# -------------------------------------------------------
# Welding
# -------------------------------------------------------
industries.welding.title=Soldadura \u2014 Trabalhos Certificados de Soldadura Industrial
industries.welding.h1=Soldadura
industries.welding.desc=\
  - Soldadura certificada de equipamentos industriais, vasos de press\u00E3o, tubagens e estruturas met\u00E1licas\n\
  - Aplica\u00E7\u00E3o dos m\u00E9todos MIG, TIG, MMA e soldadura por arco submerso consoante o material e os requisitos\n\
  - Soldadura de a\u00E7o carbono, a\u00E7o inoxid\u00E1vel, ligas de alum\u00EDnio e materiais resistentes ao calor\n\
  - Ensaios n\u00E3o destrutivos de soldaduras: inspe\u00E7\u00E3o visual, l\u00EDquidos penetrantes e ultrassons\n\
  - Qualifica\u00E7\u00E3o de procedimentos de soldadura em conformidade com a EN ISO 15614 e normas relacionadas\n\
  - Trabalhos de soldadura em obra para manuten\u00E7\u00E3o, repara\u00E7\u00F5es e novos projetos de constru\u00E7\u00E3o

# -------------------------------------------------------
# Solar Panels
# -------------------------------------------------------
industries.solar-panels.title=Pain\u00E9is Solares \u2014 Solu\u00E7\u00F5es Energ\u00E9ticas Industriais
industries.solar-panels.h1=Pain\u00E9is Solares
industries.solar-panels.desc=\
  - Fornecimento e instala\u00E7\u00E3o de sistemas fotovoltaicos de grau industrial para f\u00E1bricas e instala\u00E7\u00F5es comerciais\n\
  - Avalia\u00E7\u00E3o do local, an\u00E1lise do potencial solar e dimensionamento do sistema adaptado ao consumo real\n\
  - Projeto e instala\u00E7\u00E3o de conjuntos solares em telhado e em solo com sistemas de montagem estrutural\n\
  - Integra\u00E7\u00E3o com a infraestrutura el\u00E9trica existente, inversores e sistemas de monitoriza\u00E7\u00E3o de energia\n\
  - Configura\u00E7\u00F5es ligadas \u00E0 rede e off-grid consoante os requisitos das instala\u00E7\u00F5es\n\
  - Suporte p\u00F3s-instala\u00E7\u00E3o, monitoriza\u00E7\u00E3o de desempenho e contratos de manuten\u00E7\u00E3o a longo prazo

# -------------------------------------------------------
# Engineering
# -------------------------------------------------------
industries.engineering.title=Engenharia \u2014 Consultoria T\u00E9cnica e Gest\u00E3o de Projetos
industries.engineering.h1=Engenharia
industries.engineering.desc=\
  - Consultoria de engenharia de ciclo completo: estudos de viabilidade, auditorias t\u00E9cnicas e otimiza\u00E7\u00E3o de processos\n\
  - Desenvolvimento de documenta\u00E7\u00E3o de projeto, especifica\u00E7\u00F5es t\u00E9cnicas e desenhos de execu\u00E7\u00E3o\n\
  - Sele\u00E7\u00E3o de equipamentos, avalia\u00E7\u00E3o de fornecedores e apoio \u00E0 aquisi\u00E7\u00E3o em projetos industriais\n\
  - Fiscaliza\u00E7\u00E3o em obra e controlo de qualidade durante as fases de constru\u00E7\u00E3o e instala\u00E7\u00E3o\n\
  - Avalia\u00E7\u00E3o de conformidade com requisitos de seguran\u00E7a industrial, ambientais e regulamentares\n\
  - Apoio p\u00F3s-projeto: assist\u00EAncia ao comissionamento, forma\u00E7\u00E3o de pessoal e resolu\u00E7\u00E3o de problemas operacionais


