# --- 02. Industrial Furnaces Repair ---
services.furnaces.repair.title=Repara\u00E7\u00E3o de Fornos Industriais
services.furnaces.repair.description=Realizamos manuten\u00E7\u00E3o e repara\u00E7\u00E3o de fornos industriais de todos os tipos, minimizando o tempo de paragem e restabelecendo o desempenho operacional com rapidez e seguran\u00E7a.

