# -------------------------------------------------------
# Industrial Furnaces
# -------------------------------------------------------
industries.industrial-furnaces.title=Industrial Furnaces \u2014 Heat Treatment & Metallurgy
industries.industrial-furnaces.h1=Industrial Furnaces
industries.industrial-furnaces.desc=\
  - Design and manufacture of custom industrial furnaces for heat treatment, annealing, hardening, and tempering\n\
  - Engineering of high-temperature systems for metallurgical, ceramic, and chemical production\n\
  - Full-cycle production: from technical specification and drawings to fabrication and commissioning on site\n\
  - Repair, modernisation, and refractory lining replacement for existing furnace equipment\n\
  - Energy-efficient burner systems and automated temperature control integration\n\
  - Compliance with industrial safety standards and pressure equipment directives

# -------------------------------------------------------
# Metal Structures
# -------------------------------------------------------
industries.metal-structures.title=Metal Structures \u2014 Fabrication & Installation
industries.metal-structures.h1=Metal Structures
industries.metal-structures.desc=\
  - Design and fabrication of load-bearing steel frames for industrial buildings, warehouses, and production halls\n\
  - Manufacturing of auxiliary structures: platforms, staircases, handrails, walkways, and support frames\n\
  - Precision cutting, bending, and welding of structural steel profiles to engineering specifications\n\
  - Anti-corrosion treatment, priming, and protective coating of all metal components\n\
  - On-site assembly and installation with alignment control and quality inspection\n\
  - Documentation: material certificates, weld inspection reports, and as-built drawings

# -------------------------------------------------------
# Welding
# -------------------------------------------------------
industries.welding.title=Welding Works \u2014 Certified Industrial Welding
industries.welding.h1=Welding
industries.welding.desc=\
  - Certified welding of industrial equipment, pressure vessels, pipelines, and metal structures\n\
  - Application of MIG, TIG, MMA, and submerged arc welding methods depending on material and requirements\n\
  - Welding of carbon steel, stainless steel, aluminium alloys, and heat-resistant materials\n\
  - Non-destructive testing of welds: visual inspection, dye penetrant, and ultrasonic testing\n\
  - Welding procedure qualification in accordance with EN ISO 15614 and related standards\n\
  - On-site welding works for maintenance, repairs, and new construction projects

# -------------------------------------------------------
# Solar Panels
# -------------------------------------------------------
industries.solar-panels.title=Solar Panels \u2014 Industrial Energy Solutions
industries.solar-panels.h1=Solar Panels
industries.solar-panels.desc=\
  - Supply and installation of industrial-grade photovoltaic systems for manufacturing plants and commercial facilities\n\
  - Site assessment, solar potential analysis, and system sizing tailored to actual energy consumption\n\
  - Design and installation of rooftop and ground-mounted solar arrays with structural mounting systems\n\
  - Integration with existing electrical infrastructure, inverters, and energy monitoring systems\n\
  - Grid-connected and off-grid configurations depending on facility requirements\n\
  - Post-installation support, performance monitoring, and long-term maintenance contracts

# -------------------------------------------------------
# Engineering
# -------------------------------------------------------
industries.engineering.title=Engineering \u2014 Technical Consulting & Project Management
industries.engineering.h1=Engineering
industries.engineering.desc=\
  - Full-cycle engineering consulting: feasibility studies, technical audits, and process optimisation\n\
  - Development of project documentation, technical specifications, and working drawings\n\
  - Equipment selection, supplier evaluation, and procurement support for industrial projects\n\
  - On-site supervision and quality control throughout the construction and installation phases\n\
  - Compliance assessment against industrial safety, environmental, and regulatory requirements\n\
  - Post-project support: commissioning assistance, staff training, and operational troubleshooting



# ============================================================
# messages_en.properties \u2014 English | Individual Service Pages
# ============================================================



# -------------------------------------------------------
# 01. Industrial Furnaces Design
# -------------------------------------------------------
services.furnaces-design.title=Industrial Furnaces Design \u2014 Engineering & Technical Solutions
services.furnaces-design.h1=Industrial Furnaces Design
services.furnaces-design.desc=\
  - Development of custom furnace designs based on client process requirements: temperature range, atmosphere, load capacity, and cycle time\n\
  - Thermal calculations, heat balance analysis, and selection of optimal heating elements and refractory materials\n\
  - Preparation of full technical documentation: drawings, specifications, material lists, and equipment datasheets\n\
  - Design of control systems: temperature profiling, PLC integration, and safety interlocks\n\
  - Energy efficiency optimisation \u2014 reducing gas and electricity consumption without compromising process quality\n\
  - Coordination with manufacturing, installation, and commissioning teams throughout the project lifecycle

# -------------------------------------------------------
# 02. Industrial Furnaces Repair
# -------------------------------------------------------
services.furnaces-repair.title=Industrial Furnaces Repair \u2014 Maintenance & Restoration
services.furnaces-repair.h1=Industrial Furnaces Repair
services.furnaces-repair.desc=\
  - Diagnostic inspection and condition assessment of all furnace types: chamber, continuous, shaft, and conveyor furnaces\n\
  - Replacement and restoration of refractory lining, insulation blocks, and ceramic fibre modules\n\
  - Repair and replacement of heating elements, burners, thermocouples, and temperature control equipment\n\
  - Restoration of furnace shells, doors, seals, and mechanical drive systems\n\
  - Emergency repair services with minimum lead time to reduce production downtime\n\
  - Post-repair commissioning, temperature uniformity testing, and performance verification

# -------------------------------------------------------
# 03. Metal Structures
# -------------------------------------------------------
services.metal-structures.title=Metal Structures \u2014 Fabrication, Assembly & Installation
services.metal-structures.h1=Metal Structures
services.metal-structures.desc=\
  - Engineering and fabrication of load-bearing steel structures for industrial buildings, production halls, and warehouses\n\
  - Manufacturing of service structures: access platforms, staircases, handrail systems, and equipment support frames\n\
  - Precision cutting, forming, and welding of structural profiles, sheets, and pipes to engineering tolerances\n\
  - Surface preparation, anti-corrosion priming, and application of protective and decorative coatings\n\
  - On-site erection and installation with geodetic alignment control and documentary sign-off\n\
  - Full documentation package: material and welding certificates, dimensional inspection reports, and as-built drawings

# -------------------------------------------------------
# 04. Welding & Assembly
# -------------------------------------------------------
services.welding-assembly.title=Welding & Assembly \u2014 Certified Industrial Works
services.welding-assembly.h1=Welding & Assembly
services.welding-assembly.desc=\
  - Certified welding of industrial equipment, pressure vessels, pipelines, tanks, and metal structures\n\
  - Application of MIG/MAG, TIG, MMA, and submerged arc welding processes matched to material and joint requirements\n\
  - Welding of carbon steel, stainless steel, duplex alloys, aluminium, and heat-resistant materials\n\
  - Mechanical assembly of industrial equipment: bolted and flanged connections, bearing fits, and alignment\n\
  - Non-destructive testing of welds: visual inspection, dye penetrant testing, radiographic, and ultrasonic methods\n\
  - Welding procedure specifications (WPS) and welder qualification records maintained per EN ISO 15614

# -------------------------------------------------------
# 05. Engineering Consulting
# -------------------------------------------------------
services.engineering-consulting.title=Engineering Consulting \u2014 Technical Advisory & Project Support
services.engineering-consulting.h1=Engineering Consulting
services.engineering-consulting.desc=\
  - Technical audits of existing industrial equipment and production processes with written findings and recommendations\n\
  - Feasibility studies and investment justification for new equipment, upgrades, and facility expansions\n\
  - Development of technical specifications, tender documentation, and scope-of-work packages for procurement\n\
  - Supplier evaluation, bid analysis, and technical support during equipment selection and contract negotiation\n\
  - Construction supervision and quality control at all project stages: design, fabrication, installation, and commissioning\n\
  - Regulatory compliance review: industrial safety, environmental permits, and CE / UKCA marking requirements