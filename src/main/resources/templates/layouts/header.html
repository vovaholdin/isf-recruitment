<!DOCTYPE html>
<html lang="ru"
xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт вакансий</title>
  <link rel="stylesheet" th:href="@{/css/header.css}">
</head>
<body>
<header th:fragment="header" class="header">
  <div class="header-container">
    <!-- Logo -->
    <a href="/" class="logo">
      <div class="logo-icon"></div>
      <span class="logo-text" th:text="#{header.logo}">IndustrialServiceFurnaces</span>
    </a>

    <!-- Navigation -->
    <nav class="nav">
      <a th:href="@{/}" class="nav-link" th:text="#{nav.home}">Главная</a>
      <a th:href="@{/vacancies}" class="nav-link" th:text="#{nav.vacancies}">Вакансии</a>
      <a th:href="@{/about}" class="nav-link" th:text="#{nav.about}">О компании</a>
      <a th:href="@{/contacts}" class="nav-link" th:text="#{nav.contacts}">Контакты</a>
    </nav>

<!--    &lt;!&ndash; CTA Button &ndash;&gt;-->
<!--    <a href="/apply" class="cta-button" th:text="#{header.cta}">Подать заявку</a>-->

    <!-- Language Dropdown -->
    <div class="lang-dropdown">
      <button class="lang-btn">🌐</button>
      <ul class="lang-menu">
        <li><a href="" onclick="changeLanguage('pt'); return false;">PT</a></li>
        <li><a href="" onclick="changeLanguage('en'); return false;">EN</a></li>
        <li><a href="" onclick="changeLanguage('uk'); return false">UA</a></li>
      </ul>
    </div>

    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <nav class="mobile-nav" id="mobileNav">
    <a href="/" class="mobile-nav-link active" th:text="#{nav.home}">Главная</a>
    <a href="/vacancies" class="mobile-nav-link" th:text="#{nav.vacancies}">Вакансии</a>
    <a href="/about" class="mobile-nav-link" th:text="#{nav.about}">О компании</a>
    <a href="/contacts" class="mobile-nav-link" th:text="#{nav.contacts}">Контакты</a>
    <a href="/apply" class="mobile-cta-button" th:text="#{header.cta}">Подать заявку</a>
  </nav>
</header>



</body>

</html>
