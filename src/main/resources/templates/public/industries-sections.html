<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/images/index/logo.png}">
    <!--
        Controller must pass model attribute: industryKey
        e.g. "industrial-furnaces", "metal-structures", etc.
        Thymeleaf resolves #{industries.{industryKey}.title} etc.
    -->
    <title th:text="#{'industries.' + ${industryKey} + '.title'}">Industry</title>
    <link rel="stylesheet" th:href="@{/css/industries.css}"/>
    <link rel="stylesheet" th:href="@{/css/industry-detail.css}"/>
    <link rel="stylesheet" th:href="@{/css/header.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <div th:replace="~{layouts/header :: header}"></div>
</head>
<body>

<main class="detail-page">

    <!-- Breadcrumb -->
    <nav class="breadcrumb" aria-label="breadcrumb">
        <a th:href="@{/industries}" class="breadcrumb-link" th:text="#{page.industries.heading}">Industries</a>
        <span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-current" th:text="#{'industries.' + ${industryKey} + '.h1'}">Current</span>
    </nav>

    <!-- Hero -->
    <section class="detail-hero">
        <div class="detail-hero-inner">
            <h1 class="detail-h1" th:text="#{'industries.' + ${industryKey} + '.h1'}">Industry Name</h1>
            <div class="detail-divider"></div>
        </div>
    </section>

    <!-- Content -->
    <section class="detail-content">
        <div class="detail-content-inner">

            <!-- Description list — rendered from message key -->
            <!-- Each line starting with "- " becomes a <li> -->
            <!-- Controller splits desc by \n and trims "- " prefix -->
            <ul class="detail-list">
                <li class="detail-list-item"
                    th:each="item : ${descItems}"
                    th:text="${item}">
                    Description point here.
                </li>
            </ul>

            <!-- CTA -->
            <div class="detail-cta">
                <a th:href="@{/contact-client}" class="detail-cta-btn" th:text="#{common.contact_us}">Contact us</a>
            </div>

        </div>
    </section>

</main>

<script th:src="@{/js/header.js}"></script>
<script>
    function changeLanguage(lang) {
        const url = new URL(window.location);
        url.searchParams.set('lang', lang);
        window.location.href = url.toString();
    }
</script>
</body>
</html>
